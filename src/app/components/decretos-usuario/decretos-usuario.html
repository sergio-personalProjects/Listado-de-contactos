<div class="results min-w-0 rounded-[2rem] border border-white/80 bg-white/55 p-3 shadow-glass backdrop-blur-xl md:p-5 h-full w-full">
  <div class="tabla-contenedor max-h-[34.4rem] overflow-auto rounded-[1.35rem] border border-white/80 bg-white/65">
    <table class="w-full min-w-[50rem] border-separate border-spacing-0 text-left text-sm">
      <thead>
        <tr>
          <th class="sticky top-0 z-10 border-b border-white/60 bg-[#b41431]/90 px-5 py-4 font-bold text-white backdrop-blur-xl">
            Nº Decreto
          </th>
          <th class="sticky top-0 z-10 border-b border-white/60 bg-[#b41431]/90 px-5 py-4 font-bold text-white backdrop-blur-xl">
            Descripción
          </th>
          <th class="sticky top-0 z-10 border-b border-white/60 bg-[#b41431]/90 px-5 py-4 font-bold text-white backdrop-blur-xl text-center">
            Fecha
          </th>
          <th class="sticky top-0 z-10 border-b border-white/60 bg-[#b41431]/90 px-5 py-4 font-bold text-white backdrop-blur-xl text-center">
            Departamento
          </th>
          <th class="sticky top-0 z-10 border-b border-white/60 bg-[#b41431]/90 px-5 py-4 font-bold text-white backdrop-blur-xl text-center">
            Firmado
          </th>
          <th class="sticky top-0 z-10 border-b border-white/60 bg-[#b41431]/90 px-5 py-4 font-bold text-white backdrop-blur-xl text-center">
            Acabado
          </th>
        </tr>
      </thead>

      <tbody>
        <tr
          class="group transition hover:bg-rose-100/70"
          *ngFor="let decreto of decretos">
          <td class="border-b border-slate-200/65 px-5 py-4 font-bold text-slate-700 group-hover:text-[#97142f]">
            {{ decreto.num_decreto }}
          </td>
          <td class="border-b border-slate-200/65 px-5 py-4 text-slate-600">
            {{ decreto.descripcion }}
          </td>
          <td class="border-b border-slate-200/65 px-5 py-4 text-slate-600 text-center">
            {{ decreto.fecha }}
          </td>
          <td class="border-b border-slate-200/65 px-5 py-4 text-center">
            {{ decreto.departamento }}
          </td>
          <td class="border-b border-slate-200/65 px-5 py-4 text-center">
            {{ decreto.firmado ? 'Sí' : 'No' }}
          </td>
          <td class="border-b border-slate-200/65 px-5 py-4 text-center">
            {{ decreto.acabado ? 'Sí' : 'No' }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
