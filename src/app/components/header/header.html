<div class="bg-black text-right p-2.5 text-white">
  <a 
    href="https://sergioworks.infinityfreeapp.com/" 
    class="underline hover:text-[#08ce5a]">
    Ver más proyectos en sergioworks
  </a>
</div>

<div
  class="mx-4 mt-4 rounded-[2rem] border border-white/80 bg-white/55 px-6 py-5 shadow-glass backdrop-blur-xl md:mx-8 md:px-10 lg:mx-12"
>
  <div class="flex items-center justify-between gap-6">
    <div class="flex flex-col items-center gap-2">
      <h1 class="text-sm font-bold tracking-tight text-[#97142f] md:text-4xl">
        {{ titulo }}
      </h1>

      <button
        (click)="cambiarVista.emit()"
        class="group relative inline-flex items-center justify-center rounded-xl border border-[#b41431]/20 bg-white/80 px-5 py-2.5 text-sm font-medium text-[#b41431] shadow-sm backdrop-blur-md transition-all duration-200 hover:border-[#b41431] hover:bg-[#b41431] hover:text-white hover:shadow-md active:scale-95"
      >
        <svg
          class="mr-2 h-4 w-4 transition-transform group-hover:rotate-180 duration-300"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"
          />
        </svg>
        {{ vistaActual === 'agenda' ? 'Decretos' : 'Contactos' }}
      </button>
    </div>
    <div class="flex items-center gap-4">
      <a href="#">
        <img
          class="h-auto w-48 rounded-2xl border border-white/60 bg-white/80 p-2 shadow-lg transition-transform hover:scale-105"
          src="assets/img/empresaLogo.png"
          alt="Empresa Logo"
        />
      </a>
    </div>
  </div>

  @if (titulo === 'Decretos') {
    <div class="mt-5 flex justify-center">
      <app-navbar-decretos (cambiarVista)="cambiarVistaDecretos.emit($event)">
      </app-navbar-decretos>
    </div>
  }
</div>
