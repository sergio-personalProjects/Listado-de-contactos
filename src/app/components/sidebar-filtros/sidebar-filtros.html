<div class="sidebar-filtros flex h-[650px] flex-col justify-start rounded-[2rem] border border-white/80 bg-white/55 p-6 text-slate-700 shadow-glass backdrop-blur-xl">
    <h3 class="font-bold text-xl">Filtros</h3>
    <p class="text-sm font-semibold text-slate-500 mt-1">
      Coincidencias: <span class="font-bold text-[#b41431]">{{ coincidencias }}</span>
    </p>

    <div class="grupo mt-6 flex flex-col gap-2">
        <label class="text-sm font-bold text-slate-700" for="departamento">Departamento</label>

        <select
            [(ngModel)]="departamentoSeleccionado"
            (ngModelChange)="onFiltroChange()"
            class="w-full rounded-xl border border-white/80 bg-white/75 px-3 py-2.5 text-sm text-slate-700 outline-none transition focus:border-[#b41431] focus:ring-4 focus:ring-rose-200/70"
            id="departamento">
            <option value="">Todos los departamentos</option>
            @for(depto of departamentos; track depto){
                <option [value]="depto">{{depto}}</option>
            }
        </select>
    </div>

    <div class="grupo mt-5 flex flex-col gap-2">
        <label class="text-sm font-bold text-slate-700" for="busqueda">Buscar por nombre o teléfono</label>

        <input
            [(ngModel)]="textoBusqueda"
            (ngModelChange)="onFiltroChange()"
            class="w-full rounded-xl border border-white/80 bg-white/75 px-3 py-2.5 text-sm text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-[#b41431] focus:ring-4 focus:ring-rose-200/70"
            id="busqueda"
            type="text"
            placeholder="Buscar..."
        >
    </div>

    <div class="grupo_switch mt-5 flex items-center justify-between gap-3">
        <label class="interruptor relative inline-block h-5 w-10">
            <input
                [(ngModel)]="agruparPorDepartamento"
                (ngModelChange)="onFiltroChange()"
                class="peer sr-only"
                id="agrupar"
                type="checkbox"
            >
            <span class="slider absolute inset-0 cursor-pointer rounded-full bg-slate-400 transition after:absolute after:left-0.5 after:top-0.5 after:h-4 after:w-4 after:rounded-full after:bg-white after:shadow-sm after:transition peer-checked:bg-[#b41431] peer-checked:after:translate-x-5"></span>
        </label>
        <label class="text-sm font-bold text-slate-700" for="agrupar">
            Agrupar por departamento
        </label>
    </div>
        
    <div class="grupo_switch mt-5 flex items-center justify-between gap-3">
        <button 
            (click)="descargarCsv()"
            type="button"
            title="Descargar CSV"
            class="flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white/80 px-3 py-1.5 text-xs font-semibold text-slate-700 shadow-sm transition hover:bg-slate-100 hover:text-[#b41431] active:scale-95">

            <!-- Icono de descarga -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
            </svg>
            <!-- Fin Icono de descarga -->

            <span>Descargar CSV de contactos</span>
        </button>
    </div>

</div>
